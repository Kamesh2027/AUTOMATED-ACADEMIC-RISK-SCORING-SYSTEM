services:
  # Backend API Service
  - type: web
    name: aarss-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://aarss-frontend.onrender.com

  # Frontend React App
  - type: web
    name: aarss-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://aarss-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
